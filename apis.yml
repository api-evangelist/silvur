name: Silvur
description: >-
  Silvur (Silvur Technology Services, Inc.) is a white-label financial-wellness
  platform that helps credit unions and financial institutions deliver
  personalized retirement education and planning tools to their members and
  customers. Its patent-pending Retirement Score answers "how long will their
  money last in retirement?" and its SmartDraw technology generates personalized
  recommendations across Social Security, Medicare, retirement savings, and
  state-specific planning. Institutions launch a fully branded retirement website
  in weeks and use it to educate members and market financial products such as
  loans, mortgages, and insurance against the multi-trillion-dollar retirement
  wallet. Silvur is a venture-backed fintech (Anthemis portfolio). As of this
  enrichment pass Silvur publishes only a marketing site with legal and support
  pages and exposes no public developer portal, API reference, SDKs, or webhooks.
